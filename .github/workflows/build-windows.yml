name: Build Windows installer

# Builds the CPU and the GPU (CUDA PyTorch) edition, smoke-tests each frozen app and
# publishes both in the release "v<brekem_env.VERSION>" when:
#   - a tag v* is pushed, or
#   - a commit whose message contains [release] is pushed to a watched branch
# A manual run (Actions tab -> Run workflow) builds + tests, installer as a workflow artifact.
on:
  push:
    tags: ["v*"]
    branches: [main, windows, "claude/**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    if: >-
      github.event_name != 'push' || startsWith(github.ref, 'refs/tags/') ||
      contains(github.event.head_commit.message, '[release]')
    runs-on: windows-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        flavor: [cpu, gpu]
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Disk space
        run: Get-PSDrive -PSProvider FileSystem | Format-Table Name, @{n="FreeGB";e={[int]($_.Free/1GB)}}

      - name: Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          if ("${{ matrix.flavor }}" -eq "gpu") {   # CUDA 12.8 build: RTX 20 / 30 / 40 / 50, GTX 16
            pip install --force-reinstall --no-deps torch==2.8.0 torchaudio==2.8.0 --index-url https://download.pytorch.org/whl/cu128
            if ($LASTEXITCODE -ne 0) { throw "CUDA torch install failed" }
          }
          python -c "import torch, torchaudio; print('torch', torch.__version__, 'cuda', torch.version.cuda, 'torchaudio', torchaudio.__version__)"
          $cu = python -c "import torch; print(torch.version.cuda)"
          if (("${{ matrix.flavor }}" -eq "gpu") -ne ($cu -ne "None")) { throw "wrong torch build for ${{ matrix.flavor }}: cuda=$cu" }

      - name: FFmpeg (gyan.dev full build, GPL - has the soxr resampler)
        run: |
          Invoke-WebRequest https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-full.7z -OutFile ff.7z
          & 7z x ff.7z -offx -y | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "7z extract failed" }
          New-Item -ItemType Directory -Force vendor | Out-Null
          Get-ChildItem ffx -Recurse -Include ffmpeg.exe, ffprobe.exe | Copy-Item -Destination vendor
          Remove-Item -Recurse -Force ffx, ff.7z
          vendor\ffmpeg.exe -hide_banner -version | Select-Object -First 1
          vendor\ffmpeg.exe -v error -f lavfi -i "sine=d=0.2" -af "aresample=192000:resampler=soxr:precision=28,alimiter=level=0:latency=1" -f null -
          if ($LASTEXITCODE -ne 0) { throw "this ffmpeg lacks soxr or alimiter latency" }

      - name: AI model weights (bundled -> works offline)
        run: python build/fetch_models.py

      - name: Freeze (PyInstaller)
        run: pyinstaller build/brekem.spec --noconfirm

      - name: Smoke test - master a 20 s clip with the frozen app, OFFLINE
        timeout-minutes: 40
        env:
          # the product is 100% offline: any download attempt goes to a dead proxy and fails
          HTTP_PROXY: http://127.0.0.1:9
          HTTPS_PROXY: http://127.0.0.1:9
          ALL_PROXY: http://127.0.0.1:9
          NO_PROXY: ""
        run: |
          $exe = "dist\BrekemStudio\BrekemStudioCLI.exe"
          # installed under Program Files the app folder is read-only for the user: test it that way
          icacls "dist\BrekemStudio" /deny "${env:USERNAME}:(OI)(CI)(WD,AD,WEA,WA)" | Out-Null
          try { Set-Content "dist\BrekemStudio\_internal\engine\probe.txt" "x" -ErrorAction Stop
                Remove-Item "dist\BrekemStudio\_internal\engine\probe.txt"
                Write-Warning "app folder is still writable - the read-only check is not effective" }
          catch { Write-Host "app folder is read-only (like Program Files)" }
          vendor\ffmpeg.exe -v error -y -f lavfi -i "sine=f=110:d=20" -f lavfi -i "sine=f=330:d=20" `
            -f lavfi -i "anoisesrc=d=20:a=0.03:c=pink" -filter_complex "amix=inputs=3,volume=2,aformat=channel_layouts=stereo" `
            -ar 44100 smoke.wav
          & $exe cli master smoke.wav smoke_out --fast --tune --exciter --styles cd,signature   # default model: htdemucs_ft
          Write-Host "exit code: $LASTEXITCODE"
          $meta = "$env:LOCALAPPDATA\BrekemStudio\stems\smoke\stems.json"
          $used = Get-Content $meta | ConvertFrom-Json
          if ($used.used -ne "htdemucs_ft") { throw "default separation fell back to $($used.used) - htdemucs_ft not bundled?" }
          & $exe cli distribute smoke.wav smoke6 --sep htdemucs_6s --no-split --styles cd --exciter   # 6 stems, offline
          $used = Get-Content $meta | ConvertFrom-Json
          if ($used.used -ne "htdemucs_6s" -or -not ($used.stems -contains "guitar")) {
            throw "6-stem separation offline failed: $($used | ConvertTo-Json -Compress)"
          }
          if (-not (Test-Path "smoke6\VARIANTS\01 CD MASTER.wav")) { throw "distribute + style failed" }
          & $exe cli styles smoke.wav smoke_st --styles clarity --tune                         # Styles & Tune tab
          foreach ($f in "TUNED MIX.wav", "ACAPELLA TUNED.wav", "VARIANTS\02 CLARITY.wav") {
            if (-not (Test-Path "smoke_st\$f")) { throw "styles-only did not produce $f" }
          }
          Remove-Item -Recurse -Force smoke_st
          Remove-Item -Recurse -Force smoke6
          $need = "smoke_out\MASTER.wav", "smoke_out\ACAPELLA.wav", "smoke_out\INSTRUMENTAL.wav",
                  "smoke_out\VARIANTS\01 CD MASTER.wav", "smoke_out\VARIANTS\08 BREKEM SIGNATURE.wav",
                  "smoke_out\VARIANTS\COMPARE.html"
          $miss = $need | Where-Object { -not (Test-Path $_) }
          Get-ChildItem -Recurse smoke_out | Select-Object FullName, Length | Format-Table -AutoSize
          if ($miss) {
            Get-ChildItem "$env:LOCALAPPDATA\BrekemStudio" -Recurse -Filter *.log | ForEach-Object { Write-Host "== $_"; Get-Content $_ -Tail 60 }
            throw "frozen app did not produce: $($miss -join ', ')"
          }
          # reference mode (the main Master tab with references), incl. a reference named with a symbol
          $refs = "$env:LOCALAPPDATA\BrekemStudio\refs"
          New-Item -ItemType Directory -Force $refs | Out-Null
          vendor\ffmpeg.exe -v error -y -f lavfi -i "sine=f=82:d=30" -f lavfi -i "anoisesrc=d=30:a=0.08:c=pink" `
            -filter_complex "amix=inputs=2,volume=3,aformat=channel_layouts=stereo" -ar 44100 "$refs\ref_a.wav"
          vendor\ffmpeg.exe -v error -y -f lavfi -i "sine=f=196:d=30" -f lavfi -i "anoisesrc=d=30:a=0.05:c=white" `
            -filter_complex "amix=inputs=2,volume=3,aformat=channel_layouts=stereo" -ar 44100 "$refs\ref_b.wav"
          Rename-Item "$refs\ref_b.wav" ("Mix - ref " + [char]0x29F9 + "001 - b.wav")
          & $exe cli master smoke.wav smoke_ref --fast --exciter 2>&1 | Tee-Object -FilePath smoke_ref.log
          if (Select-String -Path smoke_ref.log -Pattern "Traceback|PermissionError|!! ERROR" -Quiet) {
            throw "reference-mode master raised an error (see the log above)"
          }
          # no GPU on this runner: the GPU edition must say so and run everything on the CPU
          if (-not (Select-String -Path smoke_ref.log -Pattern "GPU: not used" -Quiet)) { throw "no GPU line in the log" }
          foreach ($f in "MASTER.wav", "ACAPELLA.wav", "INSTRUMENTAL.wav") {
            if (-not (Test-Path "smoke_ref\$f")) { throw "reference-mode master did not produce $f" }
          }
          Remove-Item -Recurse -Force smoke_ref, smoke_ref.log, $refs
          Remove-Item -Recurse -Force smoke_out, smoke.wav
          icacls "dist\BrekemStudio" /remove:d "${env:USERNAME}" | Out-Null

      - name: Installer (Inno Setup)
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          & $iscc "/DFlavor=${{ matrix.flavor }}" build\installer.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed" }
          Get-ChildItem dist -File | Where-Object { $_.Extension -in ".exe", ".bin" } |
            Select-Object Name, @{n="MB";e={[int]($_.Length/1MB)}}

      - name: Release files (each under GitHub's 2 GB limit)
        run: |
          New-Item -ItemType Directory -Force release | Out-Null
          $files = Get-ChildItem dist -File | Where-Object { $_.Name -like "BREKEM*Setup*" -and $_.Extension -in ".exe", ".bin" }
          if (-not $files) { throw "no installer in dist" }
          foreach ($f in $files) {
            if ($f.Length -lt 1.95GB) { Copy-Item $f.FullName release\ }
            else { & 7z a -v1900m "release\$($f.BaseName).7z" $f.FullName }
          }
          Get-ChildItem release | Select-Object Name, @{n="MB";e={[int]($_.Length/1MB)}}

      - uses: actions/upload-artifact@v4
        with:
          name: brekem-studio-windows-${{ matrix.flavor }}
          path: release/*
          retention-days: 14
          compression-level: 0

  publish:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: brekem-studio-windows-*
          path: release
          merge-multiple: true

      - name: GitHub Release (CPU + GPU edition)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -l release
          ver=$(grep -oP 'VERSION = "\K[^"]+' brekem_env.py)
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then tag="$GITHUB_REF_NAME"; else tag="v$ver"; fi
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" release/* --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$tag" release/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title "BREKEM STUDIO $tag" --notes-file build/RELEASE_NOTES.md
          fi
